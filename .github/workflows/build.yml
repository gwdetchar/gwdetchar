# -----------------------
#
# Run a full build-and-test from the git repo
# using uv to install all dependencies.
#
# This is the 'full' test suite.
#
# -----------------------

name: Build and test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  conda:
    name: ${{ matrix.name || format('Python {0} ({1})', matrix.python-version, matrix.os) }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macOS
          - Ubuntu
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
    runs-on: ${{ matrix.os }}-latest

    steps:
    - name: Get source code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Package list
      run: uv pip list

    - name: Run test suite
      run: uv run -m pytest -ra --color yes --cov gwdetchar --pyargs gwdetchar --cov-report=xml --junitxml=pytest.xml

    - name: Coverage report
      run: uv run -m coverage report --show-missing

    - name: Publish coverage to Codecov
      uses: codecov/codecov-action@v5.5.2
      with:
        files: coverage.xml
        flags: ${{ runner.os }}-python${{ matrix.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
        path: pytest.xml
